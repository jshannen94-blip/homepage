<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Catalog</title>
<script>
  // Apply saved theme immediately so there's no flash of the wrong mode.
  (function(){
    try{
      var saved = localStorage.getItem("cardCatalog.theme");
      if(!saved){
        saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", saved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFBFA;
    --card:#FFFFFF;
    --ink:#121212;
    --ink-soft:#8A8A85;
    --brass:#121212;
    --brass-dark:#121212;
    --sage:#4F7A5C;
    --rose:#A8443C;
    --line:#E5E5E1;
    --line-soft:#F1F1EE;
    --shadow:none;
    --dot-ink:transparent;
    --radius:4px;
  }
  html[data-theme="dark"]{
    --paper:#111110;
    --card:#181817;
    --ink:#EDEDEA;
    --ink-soft:#7E7E79;
    --brass:#EDEDEA;
    --brass-dark:#FFFFFF;
    --sage:#7FA98A;
    --rose:#D07A72;
    --line:#2A2A28;
    --line-soft:#201F1E;
    --shadow:none;
    --dot-ink:transparent;
    --radius:4px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .wrap{ max-width: 880px; margin: 0 auto; }

  /* ---- Header ---- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .brand-eyebrow{
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass-dark);
    font-weight: 600;
    margin: 0 0 4px;
  }
  h1{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 54px;
    line-height: 0.95;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    margin: 2px 0 0;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  h1 .meridiem{
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .header-actions{ display:flex; gap:10px; align-items:center; }
  .header-actions .btn{
    opacity: .45;
    transition: opacity .15s ease, transform .12s ease, border-color .12s ease;
  }
  .header-actions .btn:hover,
  .header-actions .btn:focus-visible,
  .header-actions .btn.editing{ opacity: 1; }
  h1{ margin: 0 0 2px !important; }
  .brand-eyebrow{
    text-transform: none !important;
    letter-spacing: 0 !important;
    font-size: 14px !important;
    font-weight: 400 !important;
    color: var(--ink-soft) !important;
    margin: 0 !important;
  }

  button{ font-family: inherit; cursor:pointer; }
  .btn{
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .btn:hover{ transform: translateY(-1px); border-color: var(--brass); }
  .btn:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--brass-dark);
    outline-offset: 2px;
  }
  .btn.primary{ background: var(--brass); border-color: var(--brass); color: #fff; }
  .btn.primary:hover{ background: var(--brass-dark); border-color: var(--brass-dark); }
  .btn.editing{ background: var(--sage); border-color: var(--sage); color: #fff; }
  .btn.icon-only{ padding: 9px 11px; }
  .btn.small{ padding: 6px 11px; font-size: 12.5px; }
  .btn.ghost{ background: transparent; box-shadow:none; }
  .btn.danger{ color: var(--rose); border-color: var(--rose); background: var(--card); }

  .sync-status{
    display:none !important;
    font-size: 10.5px;
    letter-spacing: .07em;
    color: var(--ink);
    opacity: .45;
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:6px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--line); flex-shrink:0; }
  .dot.ok{ background: var(--sage); }
  .dot.err{ background: var(--rose); }
  .dot.busy{ background: var(--brass); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse{ 50%{ opacity:.35; } }

  /* ---- Sections (drawers) ---- */
  .header-rule{
    border:none;
    border-top:1px solid var(--line);
    margin: 0 0 26px;
  }
  .sections{ display:flex; flex-direction:column; gap:26px; }

  .section{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: relative;
    padding: 20px 22px 16px;
  }
  .tab{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.16em;
    color: var(--ink-soft);
    margin: 0 0 6px 6px;
  }
  .tab input{
    font-family: inherit;
    font-weight: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    background: transparent;
    border:none;
    color: var(--ink);
    width: auto;
    min-width: 40px;
  }
  .tab input::placeholder{ color: var(--ink-soft); }
  html[data-theme="dark"] .btn.primary{ color:#111110; }
  html[data-theme="dark"] .btn.editing{ color:#111110; }
  .section-controls{
    position:absolute;
    top:14px; right:14px;
    display:flex;
    gap:4px;
  }
  .mini-btn{
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    box-shadow: var(--shadow);
  }
  .mini-btn:hover{ color: var(--ink); border-color: var(--brass); }
  .mini-btn.danger:hover{ color: var(--rose); border-color: var(--rose); }

  .items{ display:flex; flex-direction:column; gap:2px; margin-top: 6px; }

  .item-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 10px 6px;
    border-bottom: 1px dashed var(--line-soft);
  }
  .item-row:last-child{ border-bottom:none; }

  a.item-link{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
    text-decoration:none;
    color: var(--ink);
    min-width:0;
  }
  a.item-link:hover .item-label{ color: var(--brass-dark); }
  a.item-link:hover{ background: var(--line-soft); border-radius:8px; margin: -6px -8px; padding: 6px 8px; }
  .item-emoji{ font-size:19px; width:24px; text-align:center; flex-shrink:0; }
  img.emoji{
    height: 1em; width: 1em;
    margin: 0 0.04em 0 0.08em;
    vertical-align: -0.18em;
    display: inline-block;
  }
  .item-label{ font-family:'Inter', sans-serif; font-size:15px; letter-spacing:-0.005em; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .item-controls{ display:flex; gap:4px; flex-shrink:0; }

  .stash{ margin-top: 10px; }
  .stash-toggle{
    border:none;
    background:transparent;
    display:block;
    width:100%;
    text-align:left;
    padding: 10px 6px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: .4;
    transition: opacity .15s ease;
  }
  .stash-toggle:hover{ opacity: .8; }
  .stash-items{ padding-left: 2px; }

  .empty-note{
    color: var(--ink-soft);
    font-size: 14px;
    padding: 10px 4px 4px;
    font-style: italic;
  }

  .add-item-row{
    display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center;
  }
  .add-item-row input{
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
  }
  .add-item-row input.emoji-field{ width: 56px; text-align:center; font-size:17px; }
  .add-item-row input.label-field{ width: 150px; flex:1; min-width:110px; }
  .add-item-row input.url-field{ width: 200px; flex:2; min-width:140px; }
  .emoji-input{
    font-family: inherit;
    width: 44px;
    text-align:center;
    font-size:17px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 2px;
    background: var(--paper);
    color: var(--ink);
  }
  .emoji-input-group{ display:flex; gap:4px; align-items:center; flex-shrink:0; }
  .pick-trigger{ font-size:14px; letter-spacing:-1px; }
  .emoji-preview{
    width: 26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    font-size: 17px;
    background: var(--line-soft);
    border-radius: 6px;
    flex-shrink:0;
  }

  .add-section-bar{
    display:flex; justify-content:center; margin-top: 6px;
  }

  footer{ display:none; }

  /* ---- Mobile ---- */
  @media (max-width: 620px){
    body{ padding: 22px 12px 60px; }
    h1{ font-size: 30px; }
    header{ align-items:flex-start; }
    .section{ padding: 24px 14px 16px; }
    .item-row{ flex-wrap: wrap; gap:8px; padding: 12px 4px; }
    .item-label{ font-size: 16px; }
    .add-item-row{ gap:6px; }
    .add-item-row input.label-field,
    .add-item-row input.url-field{ flex: 1 1 100%; min-width:0; width:auto; }
    .emoji-input-group{ flex: 0 0 auto; }
    .item-controls{ margin-left:auto; }
    .mini-btn{ width:32px; height:32px; font-size:15px; }
    .emoji-pop{ width: min(280px, 88vw); grid-template-columns: repeat(6, 1fr); }
    .emoji-pop button{ font-size:20px; padding:7px; }
    .section-controls{ right: 10px; }
  }

  /* ---- Emoji quick pick ---- */
  .emoji-pop{
    position: absolute;
    z-index: 40;
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 8px;
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:2px;
    width: 224px;
  }
  .emoji-pop button{
    border:none; background:transparent; font-size:18px; padding:5px;
    border-radius:6px;
  }
  .emoji-pop button:hover{ background: var(--line-soft); }
  .hidden{ display:none !important; }

  /* ---- Modal (settings) ---- */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(18,18,18,0.4);
    display:flex; align-items:center; justify-content:center;
    padding: 20px; z-index: 100;
  }
  .modal{
    background: var(--card);
    border-radius: 14px;
    max-width: 440px; width:100%;
    padding: 26px 24px 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    border: 1px solid var(--line);
  }
  .modal h2{
    font-family:'Inter', sans-serif;
    margin: 0 0 4px;
    font-size: 22px;
  }
  .modal p.hint{
    color: var(--ink-soft); font-size: 13px; margin: 0 0 18px;
    line-height:1.5;
  }
  .modal label{
    font-size: 13px; font-weight:600; color: var(--ink-soft);
    display:block; margin-bottom:5px; margin-top:14px;
  }
  .modal input{
    width:100%;
    font-family:inherit;
    border:1px solid var(--line);
    border-radius:8px;
    padding: 10px 11px;
    font-size:14px;
    background: var(--paper);
    color: var(--ink);
  }
  .modal-actions{
    display:flex; justify-content:space-between; align-items:center;
    margin-top: 22px; gap:10px; flex-wrap:wrap;
  }
  .modal-msg{ font-size:13px; margin-top:10px; min-height:16px; }
  .modal-msg.ok{ color: var(--sage); }
  .modal-msg.err{ color: var(--rose); }
  .modal-close{
    position:absolute; top:14px; right:14px;
  }
  .modal-wrap{ position:relative; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="nowTime">&nbsp;</h1>
      <p class="brand-eyebrow" id="todayDate">&nbsp;</p>
      <div class="sync-status" id="syncStatus">
        <span class="dot" id="syncDot"></span>
        <span id="syncText"></span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn icon-only" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
      <button class="btn icon-only" id="settingsBtn" title="Settings" aria-label="Settings">⚙️</button>
      <button class="btn icon-only" id="editBtn" title="Edit" aria-label="Edit">✏️</button>
    </div>
  </header>

  <hr class="header-rule">
  <main class="sections" id="sections"></main>

  <div class="add-section-bar hidden" id="addSectionBar">
    <button class="btn primary" id="addSectionBtn">+ Add section</button>
  </div>

  <footer>Saved locally<span id="footerSync"></span> · your own private card catalog</footer>
</div>

<!-- Settings modal -->
<div class="modal-overlay hidden" id="settingsOverlay">
  <div class="modal modal-wrap">
    <button class="btn icon-only ghost modal-close" id="closeSettings" aria-label="Close">✕</button>
    <h2>Settings</h2>
    <p class="hint">Connect a <strong>JSONBin.io</strong> bin to sync your catalog across devices. Create a free bin at jsonbin.io, then paste its Bin ID and your X-Master-Key below.</p>
    <label for="binIdInput">Bin ID</label>
    <input id="binIdInput" placeholder="e.g. 6612abc1acd3cb34a8xxxxx" autocomplete="off">
    <label for="apiKeyInput">X-Master-Key</label>
    <input id="apiKeyInput" placeholder="your JSONBin master key" autocomplete="off" type="password">
    <div class="modal-actions">
      <button class="btn ghost small" id="disconnectBtn">Disconnect</button>
      <div style="display:flex; gap:8px;">
        <button class="btn small" id="testBtn">Test connection</button>
        <button class="btn primary small" id="saveSettingsBtn">Save</button>
      </div>
    </div>
    <p class="modal-msg" id="settingsMsg"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script>
  // If the primary CDN is blocked or slow (common on mobile networks), load a backup.
  if(!window.twemoji){
    document.write('<script src="https://unpkg.com/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"><\/script>');
  }
</script>
<script>
(function(){
  "use strict";

  function twemojify(el){
    if(!el) return;
    if(window.twemoji){
      try{ window.twemoji.parse(el, { folder: "svg", ext: ".svg" }); }catch(e){}
    } else {
      // Library still loading — retry shortly so mobile slow-loads still get parsed.
      let tries = 0;
      const retry = setInterval(() => {
        tries++;
        if(window.twemoji){
          clearInterval(retry);
          try{ window.twemoji.parse(el, { folder: "svg", ext: ".svg" }); }catch(e){}
        } else if(tries > 40){
          clearInterval(retry);
        }
      }, 150);
    }
  }

  const LS_DATA = "cardCatalog.data.v1";
  const LS_SETTINGS = "cardCatalog.settings.v1";
  const QUICK_EMOJIS = ["🔗","📌","⭐","🏠","📚","🎵","✝️","🍽️","🎮","💌","🧾","🗓️","🛒","💰","🎨","🌿","☕","🐾","🧠","🔧","📷","🎬","🕹️","🧵","📝","🌙","☀️","🧭","🚀","💡"];

  let state = {
    sections: [
      {
        id: uid(), title: "Quick Links", items: [
          { id: uid(), emoji: "📧", label: "Gmail", url: "https://mail.google.com" },
          { id: uid(), emoji: "🗓️", label: "Calendar", url: "https://calendar.google.com" }
        ]
      },
      {
        id: uid(), title: "Fun", items: [
          { id: uid(), emoji: "🎬", label: "YouTube", url: "https://youtube.com" }
        ]
      }
    ]
  };
  let editing = false;
  const openStash = new Set();
  let settings = { binId: "", apiKey: "" };
  let saveTimer = null;

  function uid(){ return Math.random().toString(36).slice(2, 10); }

  function loadLocal(){
    try{
      const raw = localStorage.getItem(LS_DATA);
      if(raw){ state = JSON.parse(raw); }
    }catch(e){}
    try{
      const rawS = localStorage.getItem(LS_SETTINGS);
      if(rawS){ settings = JSON.parse(rawS); }
    }catch(e){}
  }

  function saveLocal(){
    localStorage.setItem(LS_DATA, JSON.stringify(state));
  }

  function saveSettingsLocal(){
    localStorage.setItem(LS_SETTINGS, JSON.stringify(settings));
  }

  function normalizeUrl(url){
    if(!url) return "#";
    if(!/^https?:\/\//i.test(url)) return "https://" + url;
    return url;
  }

  // ---------- Rendering ----------
  const sectionsEl = document.getElementById("sections");
  const addSectionBar = document.getElementById("addSectionBar");

  function render(){
    sectionsEl.innerHTML = "";
    state.sections.forEach((section, sIdx) => {
      sectionsEl.appendChild(renderSection(section, sIdx));
    });
    addSectionBar.classList.toggle("hidden", !editing);
    twemojify(sectionsEl);
  }

  function renderSection(section, sIdx){
    const el = document.createElement("section");
    el.className = "section";

    // tab / title
    const tab = document.createElement("div");
    tab.className = "tab";
    if(editing){
      const titleInput = document.createElement("input");
      titleInput.value = section.title;
      titleInput.placeholder = "Section name";
      titleInput.addEventListener("input", () => { section.title = titleInput.value; scheduleSave(); });
      titleInput.addEventListener("click", e => e.stopPropagation());
      tab.appendChild(titleInput);
    } else {
      tab.textContent = section.title;
    }
    el.appendChild(tab);

    if(editing){
      const controls = document.createElement("div");
      controls.className = "section-controls";
      controls.appendChild(miniBtn("↑", "Move section up", () => moveSection(sIdx, -1), sIdx === 0));
      controls.appendChild(miniBtn("↓", "Move section down", () => moveSection(sIdx, 1), sIdx === state.sections.length - 1));
      controls.appendChild(miniBtn("🗑", "Delete section", () => deleteSection(sIdx), false, true));
      el.appendChild(controls);
    }

    // items
    const itemsWrap = document.createElement("div");
    itemsWrap.className = "items";
    const total = section.items.length;
    if(total === 0){
      const empty = document.createElement("p");
      empty.className = "empty-note";
      empty.textContent = "No links yet.";
      itemsWrap.appendChild(empty);
    }
    const shown = [], stashed = [];
    section.items.forEach((item, iIdx) => {
      (!editing && item.hidden ? stashed : shown).push([item, iIdx]);
    });
    shown.forEach(([item, iIdx]) => itemsWrap.appendChild(renderItem(item, sIdx, iIdx, total)));
    el.appendChild(itemsWrap);

    if(stashed.length){
      const key = section.id || ("s" + sIdx);
      const open = openStash.has(key);
      const stash = document.createElement("div");
      stash.className = "stash";

      const toggle = document.createElement("button");
      toggle.className = "stash-toggle";
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      toggle.textContent = (open ? "▾  " : "▸  ") + stashed.length;
      toggle.addEventListener("click", () => {
        if(open) openStash.delete(key); else openStash.add(key);
        render();
      });
      stash.appendChild(toggle);

      const list = document.createElement("div");
      list.className = "items stash-items" + (open ? "" : " hidden");
      stashed.forEach(([item, iIdx]) => list.appendChild(renderItem(item, sIdx, iIdx, total)));
      stash.appendChild(list);

      el.appendChild(stash);
    }

    if(editing){
      el.appendChild(renderAddItemRow(sIdx));
    }

    return el;
  }

  function renderItem(item, sIdx, iIdx, total){
    const row = document.createElement("div");
    row.className = "item-row";

    if(editing){
      const emojiGroup = document.createElement("div");
      emojiGroup.className = "emoji-input-group";

      const preview = document.createElement("span");
      preview.className = "emoji-preview";
      preview.textContent = item.emoji || "";

      const emojiInput = document.createElement("input");
      emojiInput.className = "emoji-input";
      emojiInput.value = item.emoji || "";
      emojiInput.placeholder = "🔗";
      emojiInput.maxLength = 8;
      emojiInput.title = "Type or paste any emoji";
      emojiInput.addEventListener("input", () => {
        item.emoji = emojiInput.value;
        preview.textContent = emojiInput.value;
        twemojify(preview);
        scheduleSave();
      });
      emojiGroup.appendChild(preview);
      emojiGroup.appendChild(emojiInput);

      const pickBtn = document.createElement("button");
      pickBtn.className = "mini-btn pick-trigger";
      pickBtn.textContent = "⋯";
      pickBtn.title = "Choose from quick picks";
      pickBtn.addEventListener("click", (e) => openEmojiPicker(e.currentTarget, (emo) => {
        item.emoji = emo; emojiInput.value = emo; preview.textContent = emo; twemojify(preview); scheduleSave();
      }));
      emojiGroup.appendChild(pickBtn);

      row.appendChild(emojiGroup);

      const labelInput = document.createElement("input");
      labelInput.value = item.label;
      labelInput.placeholder = "Label";
      labelInput.style.cssText = "font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px;flex:1;min-width:90px;background:var(--paper);color:var(--ink);";
      labelInput.addEventListener("input", () => { item.label = labelInput.value; scheduleSave(); });
      row.appendChild(labelInput);

      const urlInput = document.createElement("input");
      urlInput.value = item.url;
      urlInput.placeholder = "URL";
      urlInput.style.cssText = "font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px;flex:2;min-width:120px;background:var(--paper);color:var(--ink);";
      urlInput.addEventListener("input", () => { item.url = urlInput.value; scheduleSave(); });
      row.appendChild(urlInput);

      if(item.hidden) row.style.opacity = "0.45";

      const controls = document.createElement("div");
      controls.className = "item-controls";
      controls.appendChild(miniBtn(item.hidden ? "⊘" : "👁", item.hidden ? "Show at a glance" : "Hide from at-a-glance", () => {
        item.hidden = !item.hidden;
        scheduleSave(); render();
      }));
      controls.appendChild(miniBtn("↑", "Move up", () => moveItem(sIdx, iIdx, -1), iIdx === 0));
      controls.appendChild(miniBtn("↓", "Move down", () => moveItem(sIdx, iIdx, 1), iIdx === total - 1));
      controls.appendChild(miniBtn("🗑", "Delete link", () => deleteItem(sIdx, iIdx), false, true));
      row.appendChild(controls);
    } else {
      const link = document.createElement("a");
      link.className = "item-link";
      link.href = normalizeUrl(item.url);
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      const emo = document.createElement("span");
      emo.className = "item-emoji";
      emo.textContent = item.emoji || "🔗";
      const lab = document.createElement("span");
      lab.className = "item-label";
      lab.textContent = item.label || "(untitled)";
      link.appendChild(emo);
      link.appendChild(lab);
      row.appendChild(link);
    }
    return row;
  }

  function renderAddItemRow(sIdx){
    const row = document.createElement("div");
    row.className = "add-item-row";

    const emojiGroup = document.createElement("div");
    emojiGroup.className = "emoji-input-group";

    const preview = document.createElement("span");
    preview.className = "emoji-preview";

    const emojiInput = document.createElement("input");
    emojiInput.className = "emoji-input";
    emojiInput.placeholder = "🔗";
    emojiInput.maxLength = 8;
    emojiInput.title = "Type or paste any emoji";
    emojiInput.addEventListener("input", () => {
      preview.textContent = emojiInput.value;
      twemojify(preview);
    });
    emojiGroup.appendChild(preview);
    emojiGroup.appendChild(emojiInput);

    const pickBtn = document.createElement("button");
    pickBtn.className = "mini-btn pick-trigger";
    pickBtn.textContent = "⋯";
    pickBtn.title = "Choose from quick picks";
    pickBtn.addEventListener("click", (e) => openEmojiPicker(e.currentTarget, (emo) => {
      emojiInput.value = emo;
      preview.textContent = emo;
      twemojify(preview);
    }));
    emojiGroup.appendChild(pickBtn);

    row.appendChild(emojiGroup);

    const labelInput = document.createElement("input");
    labelInput.className = "label-field";
    labelInput.placeholder = "Label";

    const urlInput = document.createElement("input");
    urlInput.className = "url-field";
    urlInput.placeholder = "URL";

    const addBtn = document.createElement("button");
    addBtn.className = "btn small primary";
    addBtn.textContent = "+ Add";
    addBtn.addEventListener("click", () => {
      if(!labelInput.value.trim() && !urlInput.value.trim()) return;
      state.sections[sIdx].items.push({
        id: uid(),
        emoji: emojiInput.value.trim() || "🔗",
        label: labelInput.value.trim() || "Untitled",
        url: urlInput.value.trim()
      });
      scheduleSave();
      render();
    });

    [labelInput, urlInput].forEach(inp => {
      inp.addEventListener("keydown", (e) => { if(e.key === "Enter") addBtn.click(); });
    });

    row.appendChild(labelInput);
    row.appendChild(urlInput);
    row.appendChild(addBtn);
    return row;
  }

  function miniBtn(symbol, title, onClick, disabled, danger){
    const b = document.createElement("button");
    b.className = "mini-btn" + (danger ? " danger" : "");
    b.textContent = symbol;
    b.title = title;
    b.setAttribute("aria-label", title);
    if(disabled){ b.style.opacity = "0.3"; b.style.pointerEvents = "none"; }
    b.addEventListener("click", onClick);
    return b;
  }

  // ---------- Emoji picker ----------
  let openPicker = null;
  function openEmojiPicker(anchorEl, onPick){
    closeEmojiPicker();
    const pop = document.createElement("div");
    pop.className = "emoji-pop";
    QUICK_EMOJIS.forEach(emo => {
      const b = document.createElement("button");
      b.textContent = emo;
      b.addEventListener("click", () => { onPick(emo); closeEmojiPicker(); });
      pop.appendChild(b);
    });
    document.body.appendChild(pop);
    twemojify(pop);
    const rect = anchorEl.getBoundingClientRect();
    pop.style.top = (window.scrollY + rect.bottom + 6) + "px";
    pop.style.left = (window.scrollX + rect.left) + "px";
    openPicker = pop;
    setTimeout(() => document.addEventListener("click", outsideClick), 0);
  }
  function outsideClick(e){
    if(openPicker && !openPicker.contains(e.target)){ closeEmojiPicker(); }
  }
  function closeEmojiPicker(){
    if(openPicker){ openPicker.remove(); openPicker = null; document.removeEventListener("click", outsideClick); }
  }

  // ---------- Mutations ----------
  function moveSection(idx, dir){
    const target = idx + dir;
    if(target < 0 || target >= state.sections.length) return;
    const [s] = state.sections.splice(idx, 1);
    state.sections.splice(target, 0, s);
    scheduleSave(); render();
  }
  function deleteSection(idx){
    if(!confirm(`Delete the "${state.sections[idx].title}" section?`)) return;
    state.sections.splice(idx, 1);
    scheduleSave(); render();
  }
  function moveItem(sIdx, iIdx, dir){
    const items = state.sections[sIdx].items;
    const target = iIdx + dir;
    if(target < 0 || target >= items.length) return;
    const [it] = items.splice(iIdx, 1);
    items.splice(target, 0, it);
    scheduleSave(); render();
  }
  function deleteItem(sIdx, iIdx){
    state.sections[sIdx].items.splice(iIdx, 1);
    scheduleSave(); render();
  }

  document.getElementById("addSectionBtn").addEventListener("click", () => {
    state.sections.push({ id: uid(), title: "New Section", items: [] });
    scheduleSave(); render();
  });

  // ---------- Edit toggle ----------
  const editBtn = document.getElementById("editBtn");
  editBtn.addEventListener("click", () => {
    editing = !editing;
    editBtn.textContent = editing ? "✓" : "✏️";
    editBtn.title = editing ? "Done" : "Edit";
    editBtn.setAttribute("aria-label", editBtn.title);
    editBtn.classList.toggle("editing", editing);
    twemojify(editBtn);
    render();
  });

  // ---------- Theme toggle ----------
  const themeBtn = document.getElementById("themeBtn");
  function currentTheme(){
    return document.documentElement.getAttribute("data-theme") || "light";
  }
  function paintThemeBtn(){
    themeBtn.textContent = currentTheme() === "dark" ? "☀️" : "🌙";
    themeBtn.title = currentTheme() === "dark" ? "Switch to light mode" : "Switch to dark mode";
    twemojify(themeBtn);
  }
  themeBtn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("cardCatalog.theme", next); }catch(e){}
    paintThemeBtn();
  });
  paintThemeBtn();

  // ---------- Save / sync ----------
  const syncDot = document.getElementById("syncDot");
  const syncText = document.getElementById("syncText");
  const footerSync = document.getElementById("footerSync");

  function setSyncState(kind, text){
    syncDot.className = "dot" + (kind ? " " + kind : "");
    syncText.textContent = text;
  }

  function refreshBaseSyncText(){
    if(settings.binId && settings.apiKey){
      setSyncState("ok", "Connected to JSONBin");
      footerSync.textContent = " · synced to JSONBin";
    } else {
      setSyncState("", "Not connected to JSONBin — links stay on this device only");
      footerSync.textContent = "";
    }
  }

  function scheduleSave(){
    saveLocal();
    if(saveTimer) clearTimeout(saveTimer);
    if(settings.binId && settings.apiKey){
      setSyncState("busy", "Saving…");
      saveTimer = setTimeout(pushToJsonbin, 700);
    }
  }

  async function pushToJsonbin(){
    try{
      const res = await fetch(`https://api.jsonbin.io/v3/b/${settings.binId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": settings.apiKey
        },
        body: JSON.stringify(state)
      });
      if(!res.ok) throw new Error("HTTP " + res.status);
      setSyncState("ok", "Synced " + new Date().toLocaleTimeString());
    }catch(err){
      setSyncState("err", "Sync failed — check settings");
    }
  }

  async function pullFromJsonbin({silent} = {}){
    if(!settings.binId || !settings.apiKey) return false;
    if(!silent) setSyncState("busy", "Loading from JSONBin…");
    try{
      const res = await fetch(`https://api.jsonbin.io/v3/b/${settings.binId}/latest`, {
        headers: { "X-Master-Key": settings.apiKey }
      });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const remote = data.record;
      if(remote && Array.isArray(remote.sections)){
        state = remote;
        saveLocal();
        render();
      }
      setSyncState("ok", "Synced " + new Date().toLocaleTimeString());
      return true;
    }catch(err){
      setSyncState("err", "Couldn't reach JSONBin");
      return false;
    }
  }

  // ---------- Settings modal ----------
  const overlay = document.getElementById("settingsOverlay");
  const binIdInput = document.getElementById("binIdInput");
  const apiKeyInput = document.getElementById("apiKeyInput");
  const settingsMsg = document.getElementById("settingsMsg");

  function openSettings(){
    binIdInput.value = settings.binId || "";
    apiKeyInput.value = settings.apiKey || "";
    settingsMsg.textContent = "";
    settingsMsg.className = "modal-msg";
    overlay.classList.remove("hidden");
  }
  function closeSettingsModal(){ overlay.classList.add("hidden"); }

  document.getElementById("settingsBtn").addEventListener("click", openSettings);
  document.getElementById("closeSettings").addEventListener("click", closeSettingsModal);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) closeSettingsModal(); });

  document.getElementById("saveSettingsBtn").addEventListener("click", async () => {
    settings.binId = binIdInput.value.trim();
    settings.apiKey = apiKeyInput.value.trim();
    saveSettingsLocal();
    refreshBaseSyncText();
    if(settings.binId && settings.apiKey){
      settingsMsg.textContent = "Saved. Pulling latest data…";
      settingsMsg.className = "modal-msg ok";
      const ok = await pullFromJsonbin();
      if(ok){
        settingsMsg.textContent = "Connected and synced!";
        settingsMsg.className = "modal-msg ok";
      } else {
        settingsMsg.textContent = "Saved, but couldn't reach JSONBin. Double-check your Bin ID and key.";
        settingsMsg.className = "modal-msg err";
      }
    } else {
      settingsMsg.textContent = "Saved.";
      settingsMsg.className = "modal-msg ok";
    }
  });

  document.getElementById("testBtn").addEventListener("click", async () => {
    const binId = binIdInput.value.trim();
    const apiKey = apiKeyInput.value.trim();
    if(!binId || !apiKey){
      settingsMsg.textContent = "Enter both a Bin ID and a Master Key first.";
      settingsMsg.className = "modal-msg err";
      return;
    }
    settingsMsg.textContent = "Testing…";
    settingsMsg.className = "modal-msg";
    try{
      const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
        headers: { "X-Master-Key": apiKey }
      });
      if(!res.ok) throw new Error("HTTP " + res.status);
      settingsMsg.textContent = "Connection works! Click Save to use this bin.";
      settingsMsg.className = "modal-msg ok";
    }catch(err){
      settingsMsg.textContent = "Couldn't connect. Check the Bin ID and key.";
      settingsMsg.className = "modal-msg err";
    }
  });

  document.getElementById("disconnectBtn").addEventListener("click", () => {
    settings = { binId: "", apiKey: "" };
    saveSettingsLocal();
    binIdInput.value = ""; apiKeyInput.value = "";
    refreshBaseSyncText();
    settingsMsg.textContent = "Disconnected. Links now stay on this device only.";
    settingsMsg.className = "modal-msg ok";
  });

  // ---------- Clock ----------
  const dateEl = document.getElementById("todayDate");
  const timeEl = document.getElementById("nowTime");
  function paintClock(){
    const now = new Date();
    dateEl.textContent = now.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
    timeEl.textContent = now.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });
  }
  paintClock();
  setInterval(paintClock, 15000);

  // ---------- Init ----------
  loadLocal();
  refreshBaseSyncText();
  render();
  twemojify(document.querySelector("header"));
  if(settings.binId && settings.apiKey){
    pullFromJsonbin({silent:true});
  }
})();
</script>
</body>
</html>
